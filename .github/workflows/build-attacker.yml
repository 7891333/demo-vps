name: build-attacker

on:
  push:
    paths:
      - 'attacker/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build attacker
        run: |
          cd attacker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o attacker attacker.go
          ls -la attacker

      - name: Upload to Releases
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 删除旧的 attacker release（如果有）
          gh release delete attacker --yes 2>/dev/null || true
          # 创建新 release 并上传
          gh release create attacker --title "attacker binary" --notes "Go attacker 静态二进制" 2>/dev/null || true
          gh release upload attacker attacker/attacker --clobber 2>&1 || echo "upload retry"
          echo "✅ attacker 已上传"